<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2026 교직원 축구 친목다지기</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
    "Pretendard",
    "Noto Sans KR",
    sans-serif;

    background:linear-gradient(135deg,#0d2f63,#1d5ea8);
    color:white;
}

.container{
    width:min(1100px,92%);
    margin:auto;
}

/* ---------------- */

header{
    padding:35px 0;
    text-align:center;
}

header img{
    width:340px;
    max-width:90%;
    background:white;
    padding:15px 25px;
    border-radius:18px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

/* ---------------- */

.hero{
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:3rem;
    margin-bottom:20px;
}

.hero p{
    font-size:1.2rem;
    opacity:.9;
}

.badge{
    display:inline-block;
    margin-top:25px;
    background:#ffca28;
    color:#222;
    padding:12px 25px;
    border-radius:999px;
    font-weight:bold;
}

/* ---------------- */

.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
margin:60px 0;

}

.card{

background:rgba(255,255,255,.12);

backdrop-filter:blur(8px);

padding:30px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.2);

transition:.3s;

}

.card:hover{

transform:translateY(-8px);

}

.card h3{

margin-bottom:15px;

font-size:1.3rem;

}

/* ---------------- */

.countdown{

display:flex;

justify-content:center;

gap:20px;

flex-wrap:wrap;

margin:50px 0;

}

.time{

background:white;

color:#123d77;

width:120px;

height:120px;

border-radius:20px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

font-weight:bold;

box-shadow:0 10px 30px rgba(0,0,0,.25);

}

.time span:first-child{

font-size:2rem;

}

/* ---------------- */

.button-area{

text-align:center;

margin:50px 0;

}

.btn{

display:inline-block;

padding:18px 45px;

background:#ffca28;

color:#222;

text-decoration:none;

font-weight:bold;

border-radius:999px;

transition:.3s;

}

.btn:hover{

transform:scale(1.05);

}

/* ---------------- */

footer{

margin-top:80px;

padding:40px 20px;

background:rgba(0,0,0,.25);

text-align:center;

line-height:2;

font-size:.95rem;

}

/* ---------------- */

.fade{

opacity:0;

transform:translateY(40px);

transition:1s;

}

.fade.show{

opacity:1;

transform:none;

}

@media(max-width:700px){

.hero h1{

font-size:2rem;

}

}

</style>

</head>

<body>

<header>

<img src="logo.png" alt="HUFS">

</header>

<div class="container">

<section class="hero fade">

<h1>⚽ 2026 교직원 축구 친목다지기</h1>

<p>

한국외국어대학교 교직원이 함께하는

즐겁고 건강한 축구 교류 행사

</p>

<div class="badge">

📅 2026년 8월 10일

</div>

</section>

<section class="countdown fade">

<div class="time">
<span id="day">0</span>
<span>DAY</span>
</div>

<div class="time">
<span id="hour">0</span>
<span>HOUR</span>
</div>

<div class="time">
<span id="min">0</span>
<span>MIN</span>
</div>

<div class="time">
<span id="sec">0</span>
<span>SEC</span>
</div>

</section>

<section class="grid fade">

<div class="card">

<h3>📍 장소</h3>

<p>

교내 운동장

(예정)

</p>

</div>

<div class="card">

<h3>⏰ 일정</h3>

<p>

8월 10일

18:30 집합

19:00 경기 시작

</p>

</div>

<div class="card">

<h3>👥 참가 대상</h3>

<p>

한국외국어대학교

교직원 누구나

</p>

</div>

<div class="card">

<h3>🎉 행사 목적</h3>

<p>

부서 간 소통과

건강한 친목 도모

</p>

</div>

</section>

<div class="button-area fade">

<a href="#" class="btn">

참가 신청하기

</a>

</div>

</div>

<footer>

<strong>한국외국어대학교 총괄지원팀</strong><br><br>

문의<br>

📧 minjipark@hufs.ac.kr<br>

☎ 031-330-4275

</footer>

<script>

// 카운트다운

const target = new Date("2026-08-10T18:30:00").getTime();

setInterval(()=>{

const now = new Date().getTime();

const diff = target-now;

if(diff<=0)return;

const d=Math.floor(diff/(1000*60*60*24));
const h=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
const m=Math.floor((diff%(1000*60*60))/(1000*60));
const s=Math.floor((diff%(1000*60))/1000);

document.getElementById("day").innerText=d;
document.getElementById("hour").innerText=h;
document.getElementById("min").innerText=m;
document.getElementById("sec").innerText=s;

},1000);

// 스크롤 애니메이션

const observer=new IntersectionObserver(entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

entry.target.classList.add("show");

}

});

});

document.querySelectorAll(".fade").forEach(el=>observer.observe(el));

</script>

</body>
</html>
